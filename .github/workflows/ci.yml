name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: CLI smoke test on sample contract
        run: python -m clauseguard.cli examples/sample_contract.txt > analysis.txt
      - name: Assert high-risk clauses are still detected
        run: |
          grep -q "HIGH" analysis.txt
          grep -qi "auto-renew" analysis.txt
          grep -qi "indemnity" analysis.txt
          echo "All expected risk categories detected."
      - name: HTML report generation
        run: python -m clauseguard.cli examples/sample_contract.txt --html report.html && test -s report.html
